# Workflow for automatically upversioning a PyPI package
# in the KDP or openkim-pipeline. Only works if the name of the package on PyPI is the
# same as the name of the issuing repo

on: 
  workflow_call:
    inputs:
      # the name of the repository to send the PR to, e.g. openkim-pipeline
      target-repository:
        required: true
        type: string
      # the base branch to update with the PR
      target-repository-base-branch:
        required: true
        type: string
      # the path to the recipe file where sed will upversion the package.
      # it will look for 
      # "[name of the triggering package]==[semver]"
      # and replace it with the latest version
      # the semver must be the basic 3 numbers, e.g. 0.1.14,
      # no betas or builds or anything like that
      recipe-file-path:
        required: true
        type: string
    secrets:
        KDP_AND_PIPELINE_PUSH_AND_PR_TOKEN:
            required: true

name: send-pr-on-release

jobs:
  send-pull-requests:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY_USER: openkim
      TARGET_REPOSITORY: ${{ inputs.target-repository }}
      TARGET_REPOSITORY_BASE_BRANCH: ${{ inputs.target-repository-base-branch }}
    steps:
      - name: Send pull-request
        run: |
          # Cut the username off the repository invoking the workflow
          DEPENDENCY_REPOSITORY=$(cut -d'/' -f 2 <<< "$GITHUB_REPOSITORY")
          # Cut the "refs/tags/" off the tag that triggered this
          RELEASE_TAG=$(cut -d'/' -f 3 <<< "$GITHUB_REF")
          # Strip off the leading "v" from the release tag, if present
          PYPI_VERSION=$(sed -n 's/^v*\([0-9]\+.[0-9]\+.[0-9]\)/\1/p' <<< "$RELEASE_TAG")
          # check that the sed pattern matched something
          [[ "$PYPI_VERSION" != "" ]]
 
          BRANCH_NAME="update-$DEPENDENCY_REPOSITORY-to-$RELEASE_TAG"
          
          # Store the PAT in a file that can be accessed by the
          # GitHub CLI.
          echo "${{ secrets.KDP_AND_PIPELINE_PUSH_AND_PR_TOKEN }}" > token.txt
          gh auth login --with-token < token.txt
          gh auth setup-git

          # Clone the remote repository and change working directory to the
          # folder it was cloned to.
          gh repo clone $TARGET_REPOSITORY_USER/$TARGET_REPOSITORY
          cd $TARGET_REPOSITORY
          git checkout $TARGET_REPOSITORY_BASE_BRANCH

          # Setup the committers identity.
          git config user.email "nikif002@umn.com"
          git config user.name "ilia's robot"

          # Create a new feature branch for the changes.
          git checkout -b $BRANCH_NAME

          # Search-replace the package name and version
          sed -i 's/'${DEPENDENCY_REPOSITORY}'==[0-9]\+.[0-9]\+.[0-9]\+/'${DEPENDENCY_REPOSITORY}'=='${PYPI_VERSION}'/g' ${{ inputs.recipe-file-path }}

          # Commit the changes and push the feature branch to origin
          git add .
          git commit -m "update $DEPENDENCY_REPOSITORY to $RELEASE_TAG"
          git push origin $BRANCH_NAME

          # Authorize GitHub CLI for the current repository and
          # create a pull-requests containing the updates.
          gh pr create \
            --body "Automatic PR to upversion $DEPENDENCY_REPOSITORY to $RELEASE_TAG" \
            --title "update $DEPENDENCY_REPOSITORY to $RELEASE_TAG" \
            --head "$BRANCH_NAME" \
            --base "$TARGET_REPOSITORY_BASE_BRANCH"
